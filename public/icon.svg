<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Sun rays radiating from behind the Bible -->
  <g opacity="0.85">
    <!-- Longer rays -->
    <line x1="50" y1="8"  x2="50" y2="2"  stroke="#F0C040" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="50" y1="92" x2="50" y2="98" stroke="#F0C040" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="8"  y1="50" x2="2"  y2="50" stroke="#F0C040" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="92" y1="50" x2="98" y2="50" stroke="#F0C040" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Diagonal rays -->
    <line x1="21.7" y1="21.7" x2="17.2" y2="17.2" stroke="#F0C040" stroke-width="3" stroke-linecap="round"/>
    <line x1="78.3" y1="21.7" x2="82.8" y2="17.2" stroke="#F0C040" stroke-width="3" stroke-linecap="round"/>
    <line x1="21.7" y1="78.3" x2="17.2" y2="82.8" stroke="#F0C040" stroke-width="3" stroke-linecap="round"/>
    <line x1="78.3" y1="78.3" x2="82.8" y2="82.8" stroke="#F0C040" stroke-width="3" stroke-linecap="round"/>

    <!-- Short diagonal rays -->
    <line x1="34"  y1="11"  x2="32"  y2="6"   stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="66"  y1="11"  x2="68"  y2="6"   stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="11"  y1="34"  x2="6"   y2="32"  stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="89"  y1="34"  x2="94"  y2="32"  stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="11"  y1="66"  x2="6"   y2="68"  stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="89"  y1="66"  x2="94"  y2="68"  stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="34"  y1="89"  x2="32"  y2="94"  stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="66"  y1="89"  x2="68"  y2="94"  stroke="#F0C040" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Glow circle behind Bible -->
  <circle cx="50" cy="50" r="30" fill="#F5D06A" opacity="0.18"/>
  <circle cx="50" cy="50" r="24" fill="#F5D06A" opacity="0.22"/>

  <!-- Bible body (back cover slightly offset) -->
  <rect x="32" y="24" width="36" height="50" rx="4" ry="4"
        fill="#C8912A" opacity="0.6"/>

  <!-- Bible body (front cover) -->
  <rect x="29" y="22" width="36" height="52" rx="4" ry="4"
        fill="url(#bibleGrad)"/>

  <!-- Bible spine highlight -->
  <rect x="29" y="22" width="5" height="52" rx="2" ry="2"
        fill="#B8832A"/>

  <!-- Bible pages (right edge) -->
  <rect x="61" y="25" width="3.5" height="46" rx="1" ry="1"
        fill="#FBF0D0" opacity="0.9"/>
  <!-- Pages lines detail -->
  <line x1="61.5" y1="29" x2="64"  y2="29" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="33" x2="64"  y2="33" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="37" x2="64"  y2="37" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="41" x2="64"  y2="41" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="45" x2="64"  y2="45" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="49" x2="64"  y2="49" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="53" x2="64"  y2="53" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="57" x2="64"  y2="57" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="61" x2="64"  y2="61" stroke="#E8D090" stroke-width="0.5"/>
  <line x1="61.5" y1="65" x2="64"  y2="65" stroke="#E8D090" stroke-width="0.5"/>

  <!-- Gold cross on cover -->
  <!-- Vertical bar -->
  <rect x="46.5" y="34" width="4" height="22" rx="1" fill="#F5D06A"/>
  <!-- Horizontal bar -->
  <rect x="40"   y="40" width="17" height="4" rx="1" fill="#F5D06A"/>

  <!-- Cover border frame -->
  <rect x="32" y="26" width="27" height="44" rx="2" ry="2"
        fill="none" stroke="#F5D06A" stroke-width="0.8" opacity="0.6"/>

  <!-- Bookmark ribbon -->
  <polygon points="54,22 57,22 57,36 55.5,33 54,36" fill="#E03030" opacity="0.85"/>

  <!-- Gradient definition for Bible cover -->
  <defs>
    <linearGradient id="bibleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#D4A24C"/>
      <stop offset="40%"  stop-color="#C8912A"/>
      <stop offset="100%" stop-color="#A0701A"/>
    </linearGradient>
  </defs>
</svg>
